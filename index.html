<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width initial-scale=1.0">
        <title>XNFT Preview Card</title>

        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <main class="card">

            <!--NFT IMAGE GO HERE-->
            <div class="card__images">
                <img class="card__image" src="assets/image-equilibrium.jpg" alt="Equilibrium NFT artwork">
                <div class="card__images-layer">
                    <img src="assets/icon-view.svg" alt="View NFT">
                </div>
            </div>

            <!--NFT TITLE GO HERE-->
            <h1 class="card__title">
                <a href="#" class="card__title-link">
                    Equilibrium #3429
                </a>
            </h1>

            <!--NFT DESCRIPTION GO HERE-->
            <p class="card__description">
                Our Equilibrium collection promotes balance and calm.
            </p>

            <!--PRICE AND TIME GO HERE-->
            <div class="card__time">
                <div class="card__time-left">
                    <img src="assets/icon-ethereum.svg" alt="View NFT">
                    <span>0.041 ETH</span>
                </div>
                <div class="card__time-right">
                    <img src="assets/icon-clock.svg" alt="View NFT">
                    <span>3 days left.</span>
                </div>
            </div>

            <!--CREATOR INFORMATION WILL GO HERE-->
            <div class="card__creator">
                <img class="card__creator-image" src="assets/logo.jpeg" alt="Creator profile picture">

                <p>
                    <span class="card__creator-label">Creation of</span>
                    <a href="#" class="card__creator-name">
                        Jules Wyvern
                    </a>
                </p>
            </div>
        </main>
        <footer class="attribution">
            Challenge by
            <a href="https://www.crio.do" target="_blank" rel="noopener">
                Crio
            </a>
            Coded by
            <a href="https://github.com/masoodaity" target="_blank" rel="noopener">
                Developer
            </a>

        </footer>
    </body>
</html>
